<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChiHao ⚡️ Sandbox</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ================= CSS TỐI GIẢN ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        body { background: #09090b; color: #fff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        :root {
            --primary: #ff8c00;
            --bg-box: #16161a;
            --border: #333;
            --text-sub: #aaa;
        }

        /* Header */
        .header { background: #111; padding: 15px; text-align: center; font-family: 'Orbitron'; font-size: 1.5rem; font-weight: 900; color: var(--primary); border-bottom: 1px solid var(--border); }

        /* Layout */
        .container { max-width: 600px; margin: 0 auto; width: 100%; padding: 15px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 80px; }

        /* Bảng Cầu */
        .board { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: #000; padding: 15px; border-radius: 12px; border: 1px solid var(--border); min-height: 70px; }
        .node { width: 45px; height: 45px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 900; color: #fff; }
        .node.empty { background: rgba(255,255,255,0.05); border: 1px dashed var(--border); }
        .node.b { background: #ff3333; } .node.p { background: #3388ff; } .node.t { background: #33cc33; }
        .node.tai { background: #111; border: 1px solid #555; } .node.xiu { background: #fff; color: #000; }

        /* Nút Bấm */
        .control { background: var(--bg-box); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .btn { padding: 15px 0; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: 900; color: #fff; cursor: pointer; }
        .btn:active { transform: scale(0.95); }
        .btn-b { background: #cc0000; } .btn-p { background: #005ce6; } .btn-t { background: #00b300; }
        .btn-tai { background: #222; border: 1px solid #555; } .btn-xiu { background: #ddd; color: #000; }
        .btn-undo { background: #555; }
        .btn-run { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 900; cursor: pointer; }

        /* Loading */
        .loading { display: none; text-align: center; margin-top: 10px; }
        .loading-text { color: var(--primary); font-weight: 800; margin-bottom: 5px; }
        .progress { height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.1s; }

        /* Kết quả */
        .result-box { display: none; background: var(--bg-box); border: 2px solid var(--primary); border-radius: 12px; padding: 20px; text-align: center; margin-top: 10px; }
        .pred-title { font-family: 'Orbitron'; font-size: 2.5rem; font-weight: 900; margin: 10px 0; }
        .pred-b { color: #ff3333; } .pred-p { color: #3388ff; }
        .pred-tai { background: #000; border: 1px solid #555; padding: 5px 20px; border-radius: 8px; display: inline-block; }
        .pred-xiu { background: #fff; color: #000; padding: 5px 20px; border-radius: 8px; display: inline-block; }

        /* 3 Thống kê */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat-card { background: #222; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #444; }
        .stat-val { font-size: 1.2rem; font-weight: 900; color: var(--primary); }
        .stat-label { font-size: 0.7rem; color: var(--text-sub); font-weight: 700; text-transform: uppercase; margin-top: 5px; }

        /* Note giải thích */
        .note-box { margin-top: 15px; font-size: 0.85rem; color: #ccc; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; font-style: italic; border-left: 3px solid var(--primary); text-align: left; }

        /* Sync */
        .sync-area { margin-top: 20px; border-top: 1px dashed #444; padding-top: 15px; }
        .sync-grid { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .sync-msg { font-size: 1.2rem; font-weight: 900; margin-top: 10px; }

        /* Menu Bottom */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-btn { background: none; border: none; color: #888; font-size: 0.8rem; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-btn.active { color: var(--primary); }
        .nav-btn i { font-size: 1.2rem; }

        /* Tab Panel */
        .tab-panel { display: none; flex-direction: column; gap: 15px; }
        .tab-panel.active { display: flex; }
    </style>
</head>
<body>

    <div class="header">ChiHao ⚡️ Sandbox</div>

    <div class="container">
        <!-- BACCARAT PANEL -->
        <div id="panel-bcr" class="tab-panel active">
            <div class="board" id="board-bcr"></div>
            <div class="control">
                <div class="grid-4">
                    <button class="btn btn-b" onclick="Game.add('bcr', 'B')">B</button>
                    <button class="btn btn-p" onclick="Game.add('bcr', 'P')">P</button>
                    <button class="btn btn-t" onclick="Game.add('bcr', 'T')">T</button>
                    <button class="btn btn-undo" onclick="Game.undo('bcr')">⌫</button>
                </div>
                <button class="btn-run" onclick="Game.run('bcr')">PHÂN TÍCH</button>
                <div class="loading" id="load-bcr">
                    <div class="loading-text" id="txt-bcr">0%</div>
                    <div class="progress"><div class="progress-fill" id="bar-bcr"></div></div>
                </div>
            </div>

            <div class="result-box" id="res-bcr">
                <div style="font-size:0.9rem; color:#aaa;">Hội đồng 15 AI dự đoán:</div>
                <div class="pred-title" id="pred-bcr">-</div>
                
                <!-- 3 Thống kê -->
                <div class="stats-grid" id="stats-bcr"></div>
                <div class="note-box" id="note-bcr"></div>

                <div class="sync-area">
                    <div style="font-weight:800; margin-bottom:10px;">Kết quả thực tế:</div>
                    <div class="sync-grid">
                        <button class="btn btn-b" style="width:70px;" onclick="Game.sync('bcr', 'B')">B</button>
                        <button class="btn btn-p" style="width:70px;" onclick="Game.sync('bcr', 'P')">P</button>
                    </div>
                    <div class="sync-msg" id="msg-bcr"></div>
                </div>
            </div>
        </div>

        <!-- TAI XIU PANEL -->
        <div id="panel-tx" class="tab-panel">
            <div class="board" id="board-tx"></div>
            <div class="control">
                <div class="grid-2">
                    <button class="btn btn-tai" onclick="Game.add('tx', 'T')">TÀI</button>
                    <button class="btn btn-xiu" onclick="Game.add('tx', 'X')">XỈU</button>
                </div>
                <button class="btn btn-undo" style="width:100%; margin-bottom:10px;" onclick="Game.undo('tx')">⌫ Xóa</button>
                <button class="btn-run" onclick="Game.run('tx')">PHÂN TÍCH</button>
                <div class="loading" id="load-tx">
                    <div class="loading-text" id="txt-tx">0%</div>
                    <div class="progress"><div class="progress-fill" id="bar-tx"></div></div>
                </div>
            </div>

            <div class="result-box" id="res-tx">
                <div style="font-size:0.9rem; color:#aaa;">Hội đồng 15 AI dự đoán:</div>
                <div class="pred-title" id="pred-tx">-</div>
                
                <!-- 3 Thống kê -->
                <div class="stats-grid" id="stats-tx"></div>
                <div class="note-box" id="note-tx"></div>

                <div class="sync-area">
                    <div style="font-weight:800; margin-bottom:10px;">Kết quả thực tế:</div>
                    <div class="sync-grid">
                        <button class="btn btn-tai" style="width:90px;" onclick="Game.sync('tx', 'T')">TÀI</button>
                        <button class="btn btn-xiu" style="width:90px;" onclick="Game.sync('tx', 'X')">XỈU</button>
                    </div>
                    <div class="sync-msg" id="msg-tx"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="UI.switchTab('bcr', this)">
            <i class="fas fa-dice"></i> Baccarat
        </button>
        <button class="nav-btn" onclick="UI.switchTab('tx', this)">
            <i class="fas fa-dice-d6"></i> Tài Xỉu
        </button>
    </div>

    <script>
        // ==========================================
        // STATE & UI
        // ==========================================
        let State = {
            bcr: [],
            tx: [],
            currentPred: null
        };

        const UI = {
            switchTab: (tabId, btn) => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + tabId).classList.add('active');
            }
        };

        // ==========================================
        // GAME CORE
        // ==========================================
        const Game = {
            add: (type, val) => {
                if (State[type].length >= 10) {
                    return alert("Chỉ nhập tối đa 10 cầu!");
                }
                State[type].push(val);
                Game.renderBoard(type);
            },
            undo: (type) => {
                State[type].pop();
                Game.renderBoard(type);
            },
            renderBoard: (type) => {
                let board = document.getElementById('board-' + type);
                board.innerHTML = '';
                
                State[type].forEach(val => {
                    let d = document.createElement('div');
                    d.className = 'node ' + val.toLowerCase();
                    d.innerText = val;
                    board.appendChild(d);
                });
                
                for(let i = State[type].length; i < 10; i++) {
                    let d = document.createElement('div');
                    d.className = 'node empty';
                    board.appendChild(d);
                }
            },
            run: (type) => {
                if (State[type].length < 10) {
                    return alert("Vui lòng nhập đủ 10 cầu!");
                }

                let load = document.getElementById('load-' + type);
                let bar = document.getElementById('bar-' + type);
                let txt = document.getElementById('txt-' + type);
                let res = document.getElementById('res-' + type);

                res.style.display = 'none';
                load.style.display = 'block';
                bar.style.width = '0%';
                txt.innerText = '0%';

                let prog = 0;
                let intv = setInterval(() => {
                    prog += 2;
                    bar.style.width = prog + '%';
                    txt.innerText = prog + '%';

                    if (prog >= 100) {
                        clearInterval(intv);
                        setTimeout(() => {
                            load.style.display = 'none';
                            Game.analyze(type);
                        }, 200);
                    }
                }, 50); // ~2.5 giây
            },
            analyze: (type) => {
                let hist = State[type];
                let isBCR = type === 'bcr';
                
                // --- THỐNG KÊ ---
                let countMain = 0; // B hoặc T
                let countSec = 0;  // P hoặc X
                let streak = 1;
                
                let mainChar = isBCR ? 'B' : 'T';
                let secChar = isBCR ? 'P' : 'X';
                
                for(let i=0; i<hist.length; i++) {
                    if(hist[i] === mainChar) countMain++;
                    else countSec++;
                }
                
                for(let i=hist.length-1; i>0; i--) {
                    if(hist[i] === hist[i-1]) streak++;
                    else break;
                }

                let swaps = 0;
                for(let i=1; i<hist.length; i++) {
                    if(hist[i] !== hist[i-1]) swaps++;
                }

                // --- AI LOGIC ---
                let finalPred = mainChar;
                let reason = "";

                // Logic 1: Bám bệt dài
                if (streak >= 3) {
                    finalPred = hist[hist.length-1];
                    reason = `Phát hiện cầu bệt dài (${streak} ván). AI quyết định bám theo xu hướng.`;
                } 
                // Logic 2: Bẻ cầu khi bệt quá dài (từ 5)
                else if (streak >= 5) {
                    finalPred = (hist[hist.length-1] === mainChar) ? secChar : mainChar;
                    reason = `Cầu bệt đã quá dài (${streak} ván). AI dự đoán sắp gãy và chọn bẻ cầu.`;
                }
                // Logic 3: Cân bằng tổng
                else if (Math.abs(countMain - countSec) >= 3) {
                    finalPred = countMain > countSec ? secChar : mainChar;
                    reason = `Sự chênh lệch giữa 2 cửa quá lớn. AI tin vào quy luật cân bằng và chọn cửa ít xuất hiện hơn.`;
                }
                // Logic 4: Cầu 1-1
                else if (swaps >= 7) {
                    finalPred = hist[hist.length-1] === mainChar ? secChar : mainChar;
                    reason = `Cầu đang đảo liên tục (1-1). AI dự đoán nhịp tiếp theo sẽ đảo cửa.`;
                }
                // Logic 5: Mặc định
                else {
                    finalPred = countMain >= countSec ? mainChar : secChar;
                    reason = `Không có dị thường. AI chọn cửa đang chiếm ưu thế nhẹ dựa trên thống kê.`;
                }

                State.currentPred = finalPred;

                // --- RENDER KẾT QUẢ ---
                let predTxt = document.getElementById('pred-' + type);
                if (isBCR) {
                    predTxt.innerText = finalPred === 'B' ? 'BANKER (B)' : 'PLAYER (P)';
                    predTxt.className = 'pred-title ' + (finalPred === 'B' ? 'pred-b' : 'pred-p');
                } else {
                    predTxt.innerText = finalPred === 'T' ? 'TÀI' : 'XỈU';
                    predTxt.className = 'pred-title ' + (finalPred === 'T' ? 'pred-tai' : 'pred-xiu');
                }

                // --- RENDER 3 THỐNG KÊ ---
                let statsBox = document.getElementById('stats-' + type);
                let pctMain = Math.round((countMain / 10) * 100);
                let pctSec = 100 - pctMain;
                
                statsBox.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-val">${pctMain}%</div>
                        <div class="stat-label">Tỷ lệ ${mainChar}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val">${streak}</div>
                        <div class="stat-label">Cầu Bệt</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val">${swaps}</div>
                        <div class="stat-label">Lần Đổi</div>
                    </div>
                `;

                // --- RENDER NOTE ---
                document.getElementById('note-' + type).innerText = reason;

                document.getElementById('res-' + type).style.display = 'block';
                document.getElementById('msg-' + type).innerText = '';
            },
            sync: (type, actual) => {
                if (!State.currentPred) return;
                
                let msg = document.getElementById('msg-' + type);
                let isWin = (actual === State.currentPred);

                if (isWin) {
                    msg.innerText = "🎉 CHÍNH XÁC!";
                    msg.style.color = "#00ff88";
                } else {
                    msg.innerText = "❌ SAI RỒI!";
                    msg.style.color = "#ff3333";
                }

                // Reset bàn
                State[type] = [];
                Game.renderBoard(type);
                State.currentPred = null;

                setTimeout(() => {
                    document.getElementById('res-' + type).style.display = 'none';
                }, 2500);
            }
        };

        // Khởi tạo bàn trống
        Game.renderBoard('bcr');
        Game.renderBoard('tx');
    </script>
</body>
</html>
